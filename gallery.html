<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ギャラリー ― 妖怪帖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700;800&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-navy:#0b1220;
    --bg-navy-mid:#121e35;
    --box-navy:#1e2d4a;
    --box-navy-soft:#182643;
    --box-border:#33456b;
    --ivory:#f2efe3;
    --ivory-dim:#cdc9ba;
    --red:#b23b3b;
    --red-bright:#d1504f;
    --muted:#8b96b3;
  }

  *{box-sizing:border-box;}

  html{scroll-behavior:smooth;}

  body{
    margin:0;
    background:var(--bg-navy);
    color:var(--ivory);
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-weight:400;
    line-height:1.9;
  }

  h1,h2,h3{
    font-family:"Shippori Mincho", serif;
  }

  a{color:inherit;}

  ::selection{
    background:var(--red);
    color:var(--ivory);
  }

  /* ---------- ナビゲーション ---------- */
  header{
    position:sticky;
    top:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 6vw;
    background:rgba(11,18,32,0.86);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--box-border);
  }

  .site-mark{
    display:flex;
    align-items:baseline;
    gap:10px;
    font-family:"Shippori Mincho", serif;
    font-size:1.25rem;
    font-weight:700;
    letter-spacing:0.08em;
    text-decoration:none;
    color:var(--ivory);
  }

  .site-mark span{
    color:var(--red-bright);
    font-size:0.95rem;
    font-weight:400;
  }

  nav ul{
    list-style:none;
    display:flex;
    gap:2.2rem;
    margin:0;
    padding:0;
  }

  nav a{
    text-decoration:none;
    font-size:0.95rem;
    color:var(--ivory-dim);
    position:relative;
    padding-bottom:4px;
    transition:color 0.25s ease;
  }

  nav a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:0;
    width:0%;
    height:1px;
    background:var(--red-bright);
    transition:width 0.3s ease;
  }

  nav a:hover,
  nav a:focus-visible{
    color:var(--ivory);
  }

  nav a:hover::after,
  nav a:focus-visible::after{
    width:100%;
  }

  nav a.active{
    color:var(--ivory);
  }

  nav a.active::after{
    width:100%;
    background:var(--red);
  }

  /* ---------- ページヘッダー ---------- */
  .page-hero{
    position:relative;
    padding:9vh 6vw 6vh;
    background:
      radial-gradient(ellipse at 82% 0%, rgba(178,59,59,0.10), transparent 45%),
      linear-gradient(180deg, var(--bg-navy) 0%, var(--bg-navy-mid) 100%);
    overflow:hidden;
  }

  .page-hero .ghost-kanji{
    position:absolute;
    right:-6vw;
    top:-10vh;
    font-size:min(38vw, 460px);
    font-weight:800;
    color:transparent;
    -webkit-text-stroke:1px rgba(178,59,59,0.14);
    line-height:1;
    pointer-events:none;
    user-select:none;
  }

  .page-hero-inner{
    position:relative;
    z-index:2;
    max-width:640px;
  }

  .page-eyebrow{
    display:inline-block;
    writing-mode:vertical-rl;
    font-family:"Shippori Mincho", serif;
    font-size:0.9rem;
    letter-spacing:0.4em;
    color:var(--red-bright);
    height:90px;
    margin-bottom:1rem;
  }

  .page-hero h1{
    font-size:clamp(2.1rem, 5.5vw, 3.1rem);
    margin:0 0 0.6rem;
    font-weight:800;
    letter-spacing:0.05em;
  }

  .page-hero p.lead{
    font-size:0.98rem;
    color:var(--ivory-dim);
    max-width:34em;
    margin:0;
  }

  /* ---------- 絞り込み ---------- */
  .gallery-wrap{
    max-width:1080px;
    margin:0 auto;
    padding:3.5rem 6vw 7rem;
  }

  .filters{
    display:flex;
    gap:0.8rem;
    margin-bottom:2.4rem;
    flex-wrap:wrap;
  }

  .filter-btn{
    background:transparent;
    border:1px solid var(--box-border);
    color:var(--ivory-dim);
    font-family:"Shippori Mincho", serif;
    font-size:0.95rem;
    letter-spacing:0.1em;
    padding:0.5em 1.6em;
    cursor:pointer;
    transition:background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
  }

  .filter-btn:hover,
  .filter-btn:focus-visible{
    border-color:var(--red-bright);
    color:var(--ivory);
  }

  .filter-btn.is-active{
    background:var(--red);
    border-color:var(--red);
    color:var(--ivory);
  }

  /* ---------- グリッド ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:1.6rem;
  }

  .work{
    margin:0;
    background:var(--box-navy);
    border:1px solid var(--box-border);
    border-left:3px solid var(--red);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    transition:transform 0.3s ease, border-color 0.3s ease;
  }

  .work:hover,
  .work:focus-visible{
    transform:translateY(-4px);
    border-color:var(--red-bright);
  }

  .work.is-hidden{display:none;}

  .thumb{
    aspect-ratio:4 / 5;
    background:var(--box-navy-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border-bottom:1px solid var(--box-border);
  }

  .thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  /* 画像を入れる前の仮表示 */
  .thumb .placeholder{
    font-family:"Shippori Mincho", serif;
    font-size:3.2rem;
    font-weight:800;
    color:transparent;
    -webkit-text-stroke:1px rgba(209,80,79,0.55);
    letter-spacing:0.1em;
  }

  .work figcaption{
    padding:1rem 1.2rem 1.2rem;
  }

  .work .kind{
    display:block;
    font-family:"Shippori Mincho", serif;
    font-size:0.78rem;
    letter-spacing:0.15em;
    color:var(--red-bright);
  }

  .work .title{
    display:block;
    font-family:"Shippori Mincho", serif;
    font-size:1.05rem;
    font-weight:700;
    color:var(--ivory);
    margin-top:0.2rem;
  }

  .work .note{
    display:block;
    font-size:0.85rem;
    color:var(--muted);
    margin-top:0.3rem;
    line-height:1.7;
  }

  /* ---------- ライトボックス ---------- */
  .lightbox{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(5,9,18,0.94);
    display:none;
    align-items:center;
    justify-content:center;
    padding:5vh 5vw;
  }

  .lightbox.is-open{display:flex;}

  .lightbox-inner{
    max-width:min(760px, 100%);
    max-height:100%;
    display:flex;
    flex-direction:column;
    gap:1rem;
    align-items:center;
  }

  .lightbox-stage{
    max-width:100%;
    max-height:74vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .lightbox-stage img{
    max-width:100%;
    max-height:74vh;
    display:block;
    border:1px solid var(--box-border);
  }

  .lightbox-stage .placeholder{
    width:min(70vw, 420px);
    aspect-ratio:4 / 5;
    background:var(--box-navy-soft);
    border:1px solid var(--box-border);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:"Shippori Mincho", serif;
    font-size:4rem;
    font-weight:800;
    color:transparent;
    -webkit-text-stroke:1px rgba(209,80,79,0.6);
  }

  .lightbox-caption{
    text-align:center;
    color:var(--ivory-dim);
    font-size:0.95rem;
  }

  .lightbox-caption strong{
    display:block;
    font-family:"Shippori Mincho", serif;
    color:var(--ivory);
    font-size:1.1rem;
  }

  .lb-btn{
    position:absolute;
    background:transparent;
    border:1px solid var(--box-border);
    color:var(--ivory);
    font-family:inherit;
    font-size:1.1rem;
    width:44px;
    height:44px;
    cursor:pointer;
    transition:background 0.25s ease, border-color 0.25s ease;
  }

  .lb-btn:hover,
  .lb-btn:focus-visible{
    background:var(--red);
    border-color:var(--red);
  }

  .lb-close{top:20px; right:20px;}
  .lb-prev{left:20px; top:50%; transform:translateY(-50%);}
  .lb-next{right:20px; top:50%; transform:translateY(-50%);}

  /* ---------- フッター ---------- */
  footer{
    border-top:1px solid var(--box-border);
    background:var(--bg-navy-mid);
    padding:4.5rem 6vw 3rem;
  }

  .footer-grid{
    max-width:1080px;
    margin:0 auto;
    display:grid;
    grid-template-columns:1.2fr 1fr;
    gap:3rem;
  }

  .footer-grid h4{
    font-family:"Shippori Mincho", serif;
    font-size:1.05rem;
    margin:0 0 1rem;
    color:var(--ivory);
  }

  .contact-form{
    display:flex;
    flex-direction:column;
    gap:0.8rem;
    max-width:420px;
  }

  .contact-form input,
  .contact-form textarea{
    background:var(--box-navy-soft);
    border:1px solid var(--box-border);
    color:var(--ivory);
    padding:0.7em 0.9em;
    font-family:inherit;
    font-size:0.92rem;
  }

  .contact-form textarea{resize:vertical; min-height:100px;}

  .contact-form input:focus,
  .contact-form textarea:focus,
  .contact-form input:focus-visible,
  .contact-form textarea:focus-visible{
    outline:1px solid var(--red-bright);
  }

  .contact-form button{
    align-self:flex-start;
    background:transparent;
    border:1px solid var(--red-bright);
    color:var(--ivory);
    padding:0.7em 1.8em;
    font-family:inherit;
    font-size:0.92rem;
    cursor:pointer;
    transition:background 0.3s ease;
  }

  .contact-form button:hover,
  .contact-form button:focus-visible{
    background:var(--red);
  }

  .hub-links ul{
    list-style:none;
    margin:0 0 1.6rem;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:0.6rem;
  }

  .hub-links a{
    text-decoration:none;
    color:var(--ivory-dim);
    font-size:0.92rem;
    border-bottom:1px dotted transparent;
    transition:border-color 0.25s ease, color 0.25s ease;
  }

  .hub-links a:hover,
  .hub-links a:focus-visible{
    color:var(--ivory);
    border-color:var(--red-bright);
  }

  .ai-notice{
    font-size:0.78rem;
    color:var(--muted);
    line-height:1.8;
    border-top:1px solid var(--box-border);
    margin-top:2.4rem;
    padding-top:1.6rem;
    max-width:1080px;
    margin-left:auto;
    margin-right:auto;
  }

  .copyright{
    text-align:center;
    font-size:0.78rem;
    color:var(--muted);
    margin-top:1.6rem;
  }

  /* ---------- レスポンシブ ---------- */
  @media (max-width: 860px){
    .grid{grid-template-columns:repeat(2, 1fr);}
    .footer-grid{grid-template-columns:1fr;}
  }

  @media (max-width: 640px){
    header{padding:14px 5vw;}
    nav ul{gap:1.1rem;}
    nav a{font-size:0.85rem;}
    .page-hero{padding:12vh 6vw 5vh;}
    .page-eyebrow{display:none;}
    .gallery-wrap{padding:2.6rem 6vw 5rem;}
    .grid{grid-template-columns:1fr;}
    .lb-prev{left:8px;}
    .lb-next{right:8px;}
    .lb-close{top:12px; right:12px;}
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    nav a::after, .work, .filter-btn, .lb-btn, .contact-form button{transition:none;}
  }
</style>
</head>
<body>

<header>
  <a class="site-mark" href="index.html">妖怪帖<span>―夜に棲むものたちの記録―</span></a>
  <nav>
    <ul>
      <li><a href="index.html">ホーム</a></li>
      <li><a href="blog.html">日誌</a></li>
      <li><a href="gallery.html" class="active">ギャラリー</a></li>
      <li><a href="about.html">about</a></li>
    </ul>
  </nav>
</header>

<section class="page-hero">
  <div class="ghost-kanji" aria-hidden="true">画</div>
  <div class="page-hero-inner">
    <span class="page-eyebrow">画帖</span>
    <h1>ギャラリー</h1>
    <p class="lead">
      妖怪をモチーフにした漫画とイラストを並べています。作品をクリックすると大きく表示されます。
    </p>
  </div>
</section>

<main class="gallery-wrap">

  <div class="filters" role="group" aria-label="作品の絞り込み">
    <button class="filter-btn is-active" data-filter="all">すべて</button>
    <button class="filter-btn" data-filter="manga">漫画</button>
    <button class="filter-btn" data-filter="illust">イラスト</button>
  </div>

  <!--
    作品の追加方法:
    .thumb の中の <div class="placeholder">…</div> を
    <img src="images/ファイル名.png" alt="作品名"> に置き換えてください。
    data-category は manga か illust にします。
  -->
  <div class="grid" id="grid">

    <figure class="work" data-category="illust" tabindex="0">
      <div class="thumb"><div class="placeholder">河童</div></div>
      <figcaption>
        <span class="kind">イラスト</span>
        <span class="title">河童</span>
        <span class="note">水辺に棲む妖怪。皿と甲羅を丁寧に描いてみた一枚。</span>
      </figcaption>
    </figure>

    <figure class="work" data-category="manga" tabindex="0">
      <div class="thumb"><div class="placeholder">座敷童子</div></div>
      <figcaption>
        <span class="kind">漫画</span>
        <span class="title">座敷童子の来た家</span>
        <span class="note">古い家に現れる子どもの話。短い一話完結の漫画。</span>
      </figcaption>
    </figure>

    <figure class="work" data-category="illust" tabindex="0">
      <div class="thumb"><div class="placeholder">雪女</div></div>
      <figcaption>
        <span class="kind">イラスト</span>
        <span class="title">雪女</span>
        <span class="note">吹雪の夜に現れる姿を、白と青で描いたイラスト。</span>
      </figcaption>
    </figure>

    <figure class="work" data-category="manga" tabindex="0">
      <div class="thumb"><div class="placeholder">百鬼夜行</div></div>
      <figcaption>
        <span class="kind">漫画</span>
        <span class="title">百鬼夜行の夜</span>
        <span class="note">行列に出会ってしまった人の一夜を描いた漫画。</span>
      </figcaption>
    </figure>

    <figure class="work" data-category="illust" tabindex="0">
      <div class="thumb"><div class="placeholder">狐火</div></div>
      <figcaption>
        <span class="kind">イラスト</span>
        <span class="title">狐火</span>
        <span class="note">夜道に並んで揺れる火を描いた一枚。</span>
      </figcaption>
    </figure>

    <figure class="work" data-category="illust" tabindex="0">
      <div class="thumb"><div class="placeholder">ぬらりひょん</div></div>
      <figcaption>
        <span class="kind">イラスト</span>
        <span class="title">ぬらりひょん</span>
        <span class="note">いつの間にか家に上がり込んでいる妖怪の落書き。</span>
      </figcaption>
    </figure>

  </div>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="作品の拡大表示">
  <button class="lb-btn lb-close" id="lbClose" aria-label="閉じる">×</button>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="前の作品">‹</button>
  <button class="lb-btn lb-next" id="lbNext" aria-label="次の作品">›</button>
  <div class="lightbox-inner">
    <div class="lightbox-stage" id="lbStage"></div>
    <div class="lightbox-caption" id="lbCaption"></div>
  </div>
</div>

<footer>
  <div class="footer-grid">
    <div>
      <h4>お問い合わせ</h4>
      <form class="contact-form" action="https://formspree.io/f/maqvpvoz" method="POST">
        <input type="text" name="name" placeholder="お名前" required>
        <input type="email" name="email" placeholder="メールアドレス" required>
        <textarea name="message" placeholder="メッセージ" required></textarea>
        <button type="submit">送信する</button>
      </form>
    </div>
    <div class="hub-links">
      <h4>Azalea Creative Room</h4>
      <ul>
        <li><a href="https://azalea72.github.io/">Azalea Creative Room トップ</a></li>
        <li><a href="index.html">妖怪帖 ホーム</a></li>
      </ul>
    </div>
  </div>
  <p class="ai-notice">
    当サイトに掲載しているイラスト・漫画・文章の無断転載、およびAIの学習データとしての利用を禁じます。
  </p>
  <p class="copyright">© 妖怪帖</p>
</footer>

<script>
(function(){
  var works = Array.prototype.slice.call(document.querySelectorAll('.work'));
  var buttons = document.querySelectorAll('.filter-btn');
  var lightbox = document.getElementById('lightbox');
  var stage = document.getElementById('lbStage');
  var caption = document.getElementById('lbCaption');
  var current = 0;

  function visibleWorks(){
    return works.filter(function(w){ return !w.classList.contains('is-hidden'); });
  }

  /* 絞り込み */
  buttons.forEach(function(btn){
    btn.addEventListener('click', function(){
      buttons.forEach(function(b){ b.classList.remove('is-active'); });
      btn.classList.add('is-active');
      var f = btn.getAttribute('data-filter');
      works.forEach(function(w){
        var show = (f === 'all' || w.getAttribute('data-category') === f);
        w.classList.toggle('is-hidden', !show);
      });
    });
  });

  /* ライトボックス */
  function render(work){
    stage.innerHTML = '';
    var img = work.querySelector('.thumb img');
    if(img){
      var big = document.createElement('img');
      big.src = img.src;
      big.alt = img.alt;
      stage.appendChild(big);
    }else{
      var ph = work.querySelector('.placeholder');
      var box = document.createElement('div');
      box.className = 'placeholder';
      box.textContent = ph ? ph.textContent : '';
      stage.appendChild(box);
    }
    var title = work.querySelector('.title').textContent;
    var note = work.querySelector('.note').textContent;
    caption.innerHTML = '';
    var s = document.createElement('strong');
    s.textContent = title;
    caption.appendChild(s);
    caption.appendChild(document.createTextNode(note));
  }

  function open(work){
    var list = visibleWorks();
    current = list.indexOf(work);
    render(work);
    lightbox.classList.add('is-open');
    document.body.style.overflow = 'hidden';
    document.getElementById('lbClose').focus();
  }

  function close(){
    lightbox.classList.remove('is-open');
    document.body.style.overflow = '';
  }

  function step(d){
    var list = visibleWorks();
    if(!list.length) return;
    current = (current + d + list.length) % list.length;
    render(list[current]);
  }

  works.forEach(function(w){
    w.addEventListener('click', function(){ open(w); });
    w.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(w); }
    });
  });

  document.getElementById('lbClose').addEventListener('click', close);
  document.getElementById('lbPrev').addEventListener('click', function(){ step(-1); });
  document.getElementById('lbNext').addEventListener('click', function(){ step(1); });

  lightbox.addEventListener('click', function(e){
    if(e.target === lightbox) close();
  });

  document.addEventListener('keydown', function(e){
    if(!lightbox.classList.contains('is-open')) return;
    if(e.key === 'Escape') close();
    if(e.key === 'ArrowLeft') step(-1);
    if(e.key === 'ArrowRight') step(1);
  });
})();
</script>

</body>
</html>
